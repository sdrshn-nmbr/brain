[project]
name = "brain-mcp-server"
version = "0.1.0"
description = "Self-hosted MCP search and controlled sharing for agent session history"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sudarshan Nambiar" }]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "rich>=14,<15",
  "uvicorn>=0.35,<1",
  "zstandard>=0.22,<1",
]

[project.urls]
Homepage = "https://github.com/sdrshn-nmbr/brain"
Repository = "https://github.com/sdrshn-nmbr/brain"
Issues = "https://github.com/sdrshn-nmbr/brain/issues"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "rich>=14,<15",
  "ruff>=0.12,<1",
]

[project.scripts]
brain = "brain.server:main"
brain-export = "collector.export.export_history:main"
brain-ingest = "collector.ingest.ingest:main"
brain-sync = "collector.sync:main"
brain-token = "brain.token:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "collector"]
exclude = ["collector/tests"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "tests", "collector/tests", "deploy", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "collector/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
