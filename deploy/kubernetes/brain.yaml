apiVersion: v1
kind: Namespace
metadata:
  name: brain
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brain
  namespace: brain
---
apiVersion: v1
kind: Secret
metadata:
  name: brain-tailscale-state
  namespace: brain
stringData: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brain-tailscale-state
  namespace: brain
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["brain-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brain-tailscale-state
  namespace: brain
subjects:
  - kind: ServiceAccount
    name: brain
    namespace: brain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brain-tailscale-state
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: brain-tailscale-serve
  namespace: brain
data:
  serve.json: |
    {
      "TCP": {"443": {"HTTPS": true}},
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:8788",
              "AcceptAppCaps": ["example.com/cap/brain"]
            }
          }
        }
      },
      "AllowFunnel": {"${TS_CERT_DOMAIN}:443": false}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brain-data
  namespace: brain
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  namespace: brain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: brain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brain
    spec:
      serviceAccountName: brain
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: brain
          image: ghcr.io/sdrshn-nmbr/brain:latest
          imagePullPolicy: Always
          env:
            - name: BRAIN_DATA_DIR
              value: /data
            - name: BRAIN_AUTH_MODE
              value: tailscale
            - name: BRAIN_ALLOWED_REPOSITORIES
              value: github.com/example/example
            - name: BRAIN_PUBLIC_HOSTS
              value: brain.your-tailnet.ts.net
            - name: BRAIN_VISIBILITY
              value: example organization
            - name: BRAIN_TAILSCALE_ADMIN_USERS
              value: you@example.com
            - name: BRAIN_TAILSCALE_APP_CAPABILITY
              value: example.com/cap/brain
            - name: BRAIN_TAILSCALE_REQUIRE_CAPABILITY
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=2)
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=2)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        - name: tailscale
          image: tailscale/tailscale:v1.102.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: brain-tailscale-auth
                  key: authkey
            - name: TS_HOSTNAME
              value: brain
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:brain
            - name: TS_KUBE_SECRET
              value: brain-tailscale-state
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: TS_USERSPACE
              value: "true"
          volumeMounts:
            - name: tailscale-serve
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: brain-data
        - name: tailscale-serve
          configMap:
            name: brain-tailscale-serve
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: brain-deny-ingress
  namespace: brain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: brain
  policyTypes: ["Ingress"]
