services:
  brain:
    build: .
    image: ghcr.io/sdrshn-nmbr/brain:latest
    restart: unless-stopped
    environment:
      BRAIN_AUTH_MODE: ${BRAIN_AUTH_MODE:-tailscale}
      BRAIN_ALLOWED_REPOSITORIES: ${BRAIN_ALLOWED_REPOSITORIES:?Set BRAIN_ALLOWED_REPOSITORIES in .env}
      BRAIN_VISIBILITY: ${BRAIN_VISIBILITY:-organization}
      BRAIN_PUBLIC_HOSTS: ${BRAIN_PUBLIC_HOSTS:-localhost}
      BRAIN_TAILSCALE_ADMIN_USERS: ${BRAIN_TAILSCALE_ADMIN_USERS:-}
      BRAIN_TAILSCALE_ALLOWED_USERS: ${BRAIN_TAILSCALE_ALLOWED_USERS:-}
      BRAIN_TAILSCALE_APP_CAPABILITY: ${BRAIN_TAILSCALE_APP_CAPABILITY:-example.com/cap/brain}
      BRAIN_TAILSCALE_REQUIRE_CAPABILITY: ${BRAIN_TAILSCALE_REQUIRE_CAPABILITY:-false}
    ports:
      - "127.0.0.1:${BRAIN_PORT:-8788}:8788"
    volumes:
      - brain-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  brain-data:
